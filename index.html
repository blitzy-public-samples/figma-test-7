<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Inline, self-contained favicon (no network request → no /favicon.ico 404).
      On-brand Plus UI mark: a white plus on a rounded indigo (#4338CA) square,
      echoing the hero gradient. Encoded as an SVG data URI so it ships entirely
      within this shell with no extra asset file. Decoded SVG:
        <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'>
          <rect width='32' height='32' rx='6' fill='#4338CA'/>
          <path d='M13.5 6h5v7.5H26v5h-7.5V26h-5v-7.5H6v-5h7.5z' fill='#FFFFFF'/>
        </svg>
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20viewBox=%270%200%2032%2032%27%3E%3Crect%20width=%2732%27%20height=%2732%27%20rx=%276%27%20fill=%27%234338CA%27/%3E%3Cpath%20d=%27M13.5%206h5v7.5H26v5h-7.5V26h-5v-7.5H6v-5h7.5z%27%20fill=%27%23FFFFFF%27/%3E%3C/svg%3E"
    />
    <!--
      Force a light color scheme. The Figma "Welcome" frame is a light design
      (page background #FFFFFF); pinning the scheme keeps user-agent styling and
      form-control theming deterministic so the Playwright fidelity screenshots
      match the Figma source regardless of the host OS dark-mode preference.
    -->
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Welcome to Plus UI — a design-system welcome page introducing Plus UI, its key principles, and its communities."
    />
    <title>Welcome to Plus UI</title>

    <!--
      Preload the primary self-hosted Inter weights (400/500/600) used across the
      page so text paints with the correct metrics as early as possible; this
      stabilizes first paint during headless screenshot capture. Vite resolves and
      fingerprints these /src/... asset URLs at build time (the same mechanism that
      rewrites the module script below), so the built HTML points at the hashed
      files in /assets/. The authoritative @font-face `src` lives in
      src/styles/fonts.css; these tags are a load-priority hint only. `crossorigin`
      is required because web fonts are always fetched in anonymous CORS mode — it
      makes the browser reuse the preloaded response for the @font-face request
      instead of fetching the file twice.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/inter/Inter-Regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/inter/Inter-Medium.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/inter/Inter-SemiBold.woff2"
      crossorigin
    />
  </head>
  <body>
    <!--
      Single React mount node. src/main.tsx targets this element via
      ReactDOM.createRoot(document.getElementById('root')). The entire Welcome
      page is rendered by React into #root — this file is only the app shell and
      intentionally contains no page UI.
    -->
    <div id="root"></div>

    <!--
      Vite entry: reference the TypeScript source (NOT a built path). Vite
      transforms this to the hashed production bundle during `vite build`.
    -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
